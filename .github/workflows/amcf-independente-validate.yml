name: Validar AMCF sem Enter

on:
  push:
    branches: [amcf-react-supabase-independente]
  pull_request:
    branches: [enter-main]

jobs:
  validar:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 8.6.12
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - name: Instalar dependências sem Enter
        run: pnpm install --no-frozen-lockfile
      - name: Tipagem
        run: pnpm exec tsc -b
      - name: Lint
        run: pnpm run lint
      - name: Testes unitários
        run: pnpm run test:unit
      - name: Build de produção
        run: pnpm run build:prod
