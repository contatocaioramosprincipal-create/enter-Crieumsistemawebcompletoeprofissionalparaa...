name: AMCF - Radar de Nomeacoes - Quality Gate
on:
  push:
    branches:
      - feat/amcf-prospeccao-nomeacoes-20261122
  pull_request:
    branches:
      - amcf-react-supabase-independente
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --no-frozen-lockfile
      - name: TypeScript project validation
        run: pnpm exec tsc -b
      - name: Production build
        env:
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: ci-placeholder
        run: pnpm run build:prod
